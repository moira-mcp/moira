name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DOCKER_IMAGE: mcp-moira-ci
  DOCKER_PORT: 3030

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run Prettier
        run: npx prettier --check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup env file
        run: cp .env.ci .env

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify release policy
        run: npm run test:release-policy

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup env file
        run: |
          cp .env.ci .env
          # Override DB_PATH for integration tests
          echo "DB_PATH=./data/test-integration.db" >> .env

      - name: Create data directory
        run: mkdir -p data

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

  docker-build-and-test:
    name: Docker Build & API Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup env files
        run: |
          cp .env.ci .env.local
          cp .env.ci .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./config/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            MOIRA_HOST=localhost:${{ env.DOCKER_PORT }}
            STATIC_ARTIFACTS_DOMAIN=static.localhost:${{ env.DOCKER_PORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create data directory
        run: mkdir -p data

      - name: Start Docker container
        run: |
          docker run \
            --name ${{ env.DOCKER_IMAGE }} \
            -p ${{ env.DOCKER_PORT }}:80 \
            --env-file .env.ci \
            -e MCP_PORT=3000 \
            -e WEB_BACKEND_PORT=3001 \
            -e WEB_FRONTEND_PORT=3002 \
            -v "$(pwd)/workflows:/app/workflows" \
            -v "$(pwd)/data:/app/data" \
            -e DISABLE_RATE_LIMIT=true \
            -d \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Wait for application to start
        run: |
          echo "Waiting for application to be ready..."
          TIMEOUT=60
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -f -s http://localhost:${{ env.DOCKER_PORT }}/startup-ready > /dev/null 2>&1; then
              echo "Application is ready!"
              exit 0
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "Waiting... ($ELAPSED/$TIMEOUT)"
          done
          echo "Application failed to start!"
          docker logs ${{ env.DOCKER_IMAGE }}
          exit 1

      - name: Start MCP Inspector
        run: |
          docker compose -f docker-compose.inspector.yml up -d
          echo "Waiting for MCP Inspector to start..."
          sleep 5
          curl -f -s http://localhost:6274 > /dev/null && echo "MCP Inspector is ready!" || echo "MCP Inspector may not be ready yet"

      - name: Run API tests
        # The primary API container intentionally runs in SaaS mode. The
        # self-host admission contract is exercised against a second,
        # explicitly self-host container below.
        run: npm run test:api
        env:
          CI: true
          API_TEST_TARGET: saas
          TEST_BASE_URL: http://localhost:${{ env.DOCKER_PORT }}

      - name: Run MCP tools tests
        run: npm run test:mcp-tools
        env:
          CI: true
          TEST_BASE_URL: http://localhost:${{ env.DOCKER_PORT }}

      - name: Start self-host Docker container
        run: |
          mkdir -p data-self-host
          docker run \
            --name ${{ env.DOCKER_IMAGE }}-self-host \
            -p 3031:80 \
            --env-file .env.ci \
            -v "$(pwd)/workflows:/app/workflows" \
            -v "$(pwd)/data-self-host:/app/data" \
            -e DEPLOYMENT_MODE=self-host \
            -e MOIRA_HOST=localhost:3031 \
            -e STATIC_ARTIFACTS_DOMAIN=static.localhost:3031 \
            -e MCP_PORT=3000 \
            -e WEB_BACKEND_PORT=3001 \
            -e WEB_FRONTEND_PORT=3002 \
            -e EMAIL_PROVIDER=none \
            -e BREVO_API_KEY= \
            -e EMAIL_TEST_RECIPIENTS=false \
            -e DISABLE_RATE_LIMIT=true \
            -d \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Wait for self-host application to start
        run: |
          echo "Waiting for self-host application to be ready..."
          TIMEOUT=60
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -f -s http://localhost:3031/startup-ready > /dev/null 2>&1; then
              echo "Self-host application is ready!"
              exit 0
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "Waiting... ($ELAPSED/$TIMEOUT)"
          done
          echo "Self-host application failed to start!"
          docker logs ${{ env.DOCKER_IMAGE }}-self-host
          exit 1

      - name: Run self-host admission and capability API tests
        run: |
          npm run test:api:ci -- --file tests/api/auth/self-host-auth.test.ts
          npm run test:api:ci -- --file tests/api/capability-boundary-api.test.ts
        env:
          CI: true

      # E2E (Playwright) tests are flaky on shared CI runners and are NOT run on PRs.
      # They run nightly + on-demand in .github/workflows/e2e.yml instead, so they
      # never block a merge. See CONTRIBUTING.md "Releases & versioning".

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-test-results
          path: |
            test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker logs ${{ env.DOCKER_IMAGE }}

      - name: Stop Docker containers
        if: always()
        run: |
          docker stop ${{ env.DOCKER_IMAGE }} || true
          docker stop ${{ env.DOCKER_IMAGE }}-self-host || true
          docker compose -f docker-compose.inspector.yml down || true
