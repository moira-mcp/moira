name: E2E (nightly)

# End-to-end (Playwright) tests are flaky on shared CI runners, so they are kept
# OUT of the PR gate (ci.yml) and run here instead: nightly on a schedule, and
# on-demand via workflow_dispatch. A failure here does NOT block any PR merge —
# it is a signal to investigate, not a gate.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: mcp-moira-ci
  DOCKER_PORT: 3030

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup env files
        run: |
          cp .env.ci .env.local
          cp .env.ci .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./config/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            MOIRA_HOST=localhost:${{ env.DOCKER_PORT }}
            STATIC_ARTIFACTS_DOMAIN=static.localhost:${{ env.DOCKER_PORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create data directory
        run: mkdir -p data

      - name: Start Docker container
        run: |
          docker run \
            --name ${{ env.DOCKER_IMAGE }} \
            -p ${{ env.DOCKER_PORT }}:80 \
            --env-file .env.ci \
            -e MCP_PORT=3000 \
            -e WEB_BACKEND_PORT=3001 \
            -e WEB_FRONTEND_PORT=3002 \
            -v "$(pwd)/workflows:/app/workflows" \
            -v "$(pwd)/data:/app/data" \
            -e DISABLE_RATE_LIMIT=true \
            -d \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Wait for application to start
        run: |
          echo "Waiting for application to be ready..."
          TIMEOUT=60
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -f -s http://localhost:${{ env.DOCKER_PORT }}/startup-ready > /dev/null 2>&1; then
              echo "Application is ready!"
              exit 0
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "Waiting... ($ELAPSED/$TIMEOUT)"
          done
          echo "Application failed to start!"
          docker logs ${{ env.DOCKER_IMAGE }}
          exit 1

      - name: Start MCP Inspector
        run: |
          docker compose -f docker-compose.inspector.yml up -d
          echo "Waiting for MCP Inspector to start..."
          sleep 5
          curl -f -s http://localhost:6274 > /dev/null && echo "MCP Inspector is ready!" || echo "MCP Inspector may not be ready yet"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          TEST_BASE_URL: http://localhost:${{ env.DOCKER_PORT }}

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker logs ${{ env.DOCKER_IMAGE }}

      - name: Stop Docker containers
        if: always()
        run: |
          docker stop ${{ env.DOCKER_IMAGE }} || true
          docker compose -f docker-compose.inspector.yml down || true
