name: Security Checks

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          vulnerability-check: true
          license-check: false
          warn-only: false
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

      - name: Check out pull request as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Remove pull-request actionlint policy
        run: rm -f .github/actionlint.yml .github/actionlint.yaml

      - name: Validate workflow syntax and expressions
        uses: devops-actions/actionlint@216abcda9203ffeaeb953db1b151c94e1927c5bf # v1.0.0
        with:
          fail-on-errors: true

      - name: Require immutable external Actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11
