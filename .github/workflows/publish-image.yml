name: Publish Image

# Builds the public self-host image and pushes it to GHCR as a MULTI-ARCH
# manifest (linux/amd64 + linux/arm64). Each architecture is built on its own
# NATIVE runner (amd64 → ubuntu-latest, arm64 → ubuntu-24.04-arm) — no QEMU
# emulation, so arm64 builds are fast. Each arch is pushed by digest; a final
# job stitches the per-arch digests into one tagged manifest list.
#
# APP_BASE_PATH=/ puts the Web UI at the root. Only explicit non-secret URL
# values are supplied at build time; runtime configuration is not baked into
# the public image. Publishes the image only; it does not deploy anywhere.

on:
  # Primary path: called by release.yml after a semantic-release version is cut,
  # to publish the versioned multi-arch image. `:latest` now tracks the latest
  # release (not every master push). A tag created by release.yml's GITHUB_TOKEN
  # does NOT re-trigger workflows, which is why this is invoked via workflow_call.
  workflow_call:
    inputs:
      version:
        description: "Release version to tag the image with (e.g. 0.4.0)"
        required: true
        type: string
  # Manual safety paths: a human pushing a v* tag, or a manual dispatch.
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Canonical image ref — pinned lowercase (GHCR lowercases the org). Used
  # identically for push (here) and pull (docker-compose.yml). Hardcoded rather
  # than ${{ github.repository_owner }} so the ref is stable regardless of which
  # org/fork builds it.
  IMAGE_NAME: moira-mcp/moira

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: config/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_BASE_PATH=/
            MOIRA_HOST=localhost:8080
            CONTACT_EMAIL=support@localhost
            STATIC_ARTIFACTS_DOMAIN=static.localhost:8080
            BUILD_ID=public
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Under workflow_call the context is the caller's branch ref (refs/heads/master),
      # so the `type=semver` lines below produce NOTHING — derive the version tags
      # explicitly from the input instead. `minor` = version with the patch dropped
      # (0.4.1 -> 0.4).
      - name: Derive version tags
        id: ver
        if: ${{ inputs.version != '' }}
        run: |
          V='${{ inputs.version }}'
          echo "full=$V"       >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.full }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version || steps.meta.outputs.version }}

  workspace:
    name: Publish workspace runtime and Feature
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Workspace image metadata
        id: workspace-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/moira-mcp/moira-workspace-service
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}}
            type=sha
      - name: Publish common workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: config/Dockerfile.workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.workspace-meta.outputs.tags }}
          build-args: GIT_COMMIT=${{ github.sha }}
      - name: Prepare identical Feature payloads
        if: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          WORKSPACE_FEATURE_VERSION="$version" node scripts/prepare-workspace-feature.js
      - name: Publish optional Dev Container Feature
        if: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
        run: npx --yes @devcontainers/cli@0.89.0 features publish --namespace moira-mcp/features agent_temp_files_local/workspace-feature
