# MCP Moira — self-hosted local deploy
#
# Quickstart:
#   cp .env.example .env       # localhost defaults work unchanged
#   docker compose up -d
#   open http://localhost:8080
#
# This compose runs Moira on a single port with direct port-mapping — no Traefik,
# no reverse proxy, no external networks. To serve it on a public domain, put your
# own reverse proxy (Traefik, Caddy, nginx, …) with TLS in front of this container.

services:
  moira:
    container_name: moira

    # --- Option A: use the prebuilt public image (DEFAULT) ---
    # Pulled from GHCR — no source checkout or local build needed. This is the
    # recommended self-host path: `cp .env.example .env` then `docker compose up -d`.
    # Update later with `docker compose pull` followed by `docker compose up -d`;
    # image startup protects the mounted SQLite state before migrations.
    image: ${MOIRA_IMAGE:-ghcr.io/moira-mcp/moira:latest}

    # --- Option B: build the image locally from source (advanced) ---
    # For contributors / customizers only. Requires the full source tree.
    # Comment out the `image:` line above and uncomment the `build:` block below.
    # build:
    #   context: .
    #   dockerfile: config/Dockerfile
    #   args:
    #     BUILD_ID: local
    #     MOIRA_HOST: ${MOIRA_HOST:-localhost:8080}
    #     STATIC_ARTIFACTS_DOMAIN: ${STATIC_ARTIFACTS_DOMAIN:-static.localhost:8080}
    #     APP_BASE_PATH: /

    # Intentional init failure stops with code 0 after restoring state and printing
    # recovery instructions, so it does not loop. Unexpected non-zero crashes retry
    # a bounded number of times.
    restart: "on-failure:3"

    # Runtime configuration. Values here override the defaults baked into the
    # image at build time (dotenv does not overwrite existing process.env).
    # For another host, set MOIRA_HOST, MOIRA_PORT, and STATIC_ARTIFACTS_DOMAIN.
    # Leave BETTER_AUTH_SECRET, TELEGRAM_ENCRYPTION_KEY, and ADMIN_PASSWORD empty
    # in self-host mode so first-start bootstrap generates and persists them.
    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - WORKFLOWS_DIR=./workflows/production
      - METRICS_PORT=9090
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Empty keeps extensions disabled. When the optional profile is enabled, point this at the
      # runner service over the Compose network.
      - MOIRA_EXTENSION_RUNNER_URL=${MOIRA_EXTENSION_RUNNER_URL:-}

    # The dependency is optional because the runner profile is off by default. When the profile is
    # selected, wait for its catalog endpoint before Moira performs its one-time registry sync.
    depends_on:
      moira-extension-runner:
        condition: service_healthy
        required: false

    # Host port (left) → container nginx port 80 (right). Change MOIRA_PORT in .env
    # to use a different host port. Keep it consistent with MOIRA_HOST.
    ports:
      - "${MOIRA_PORT:-8080}:80"

    # SQLite database + execution storage persist on the host. Survives rebuilds.
    volumes:
      - ./data:/app/data

    # Internal metrics/health server (9090) is the source of truth for health.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Extension handlers run in a companion process. The profile is deliberately disabled by
  # default, and the local bundle directory is visible only to this service.
  moira-extension-runner:
    profiles: ["extensions"]
    build:
      context: .
      dockerfile: config/Dockerfile.extension-runner
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MOIRA_EXTENSIONS_DIR=/app/extensions
      - MOIRA_EXTENSION_RUNNER_PORT=9110
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./extensions:/app/extensions:ro
    expose:
      - "9110"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9110/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
